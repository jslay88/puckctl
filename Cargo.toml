[workspace]
resolver = "2"
members = ["crates/puckctl-protocol", "crates/puckctl", "crates/puckctl-tray"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Justin Slay <justin.slay@gmail.com>"]
repository = "https://github.com/jslay88/puckctl"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
