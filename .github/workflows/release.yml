name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  release:
    name: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev pkg-config
      - name: version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$tag" = "$crate"
      - name: cargo build --release
        run: cargo build --release --workspace
      - name: pack
        run: sh scripts/pack-release.sh
      - name: publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/puckctl-*-x86_64-linux.tar.gz \
            dist/puckctl-x86_64-linux.tar.gz \
            dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
